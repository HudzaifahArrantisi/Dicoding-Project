name: Deploy Daisuki Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    name: Deploy API Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: model-LLM
    concurrency:
      group: daisuki-api-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Check deployment credentials
        run: |
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!key}" ]; then
              echo "::error::Set $key in GitHub environment model-LLM (token as secret, account ID as variable)."
              exit 1
            fi
          done
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck API
        run: bun run --cwd apps/api typecheck
      - name: Deploy API Worker
        working-directory: apps/api
        run: bunx wrangler@4.95.0 deploy --config wrangler.jsonc

  graph:
    name: Deploy Graph Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: model-LLM
    concurrency:
      group: daisuki-graph-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Check deployment credentials
        run: |
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!key}" ]; then
              echo "::error::Set $key in GitHub environment model-LLM (token as secret, account ID as variable)."
              exit 1
            fi
          done
      - name: Deploy Graph Worker and assets
        working-directory: apps/graph
        run: bunx wrangler@4.95.0 deploy --config wrangler.jsonc

  web:
    name: Deploy Web Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: model-LLM
    concurrency:
      group: daisuki-web-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Check deployment credentials
        run: |
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!key}" ]; then
              echo "::error::Set $key in GitHub environment model-LLM (token as secret, account ID as variable)."
              exit 1
            fi
          done
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build web
        working-directory: apps/web
        run: bun run build
      - name: Deploy Web Worker
        working-directory: apps/web
        run: bunx wrangler@4.95.0 deploy
