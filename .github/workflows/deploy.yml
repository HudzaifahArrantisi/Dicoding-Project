name: Deploy Daisuki Workers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Code checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck web + API
        run: bun run typecheck
      - name: Lint web
        run: bun run --cwd apps/web lint
      - name: Check graph dashboard script syntax
        run: node --check apps/graph/public/app.js
      - name: Check Python syntax (ai + data-science)
        run: |
          python3 -c "import pathlib, py_compile; files=[p for d in ('ai','data-science') for p in pathlib.Path(d).rglob('*.py') if '.venv' not in p.parts]; [py_compile.compile(str(f), doraise=True) for f in files]; print(f'py_compile OK: {len(files)} files')"
      - name: Run offline unit tests
        run: bun run test:ci
      - name: Build web bundle
        working-directory: apps/web
        run: bun run build

  tests:
    name: Unit tests (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run unit tests
        run: bun test --reporter=junit --reporter-outfile=bun-test.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bun-test-report
          path: bun-test.xml
          if-no-files-found: ignore

  api:
    name: Deploy API Worker
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: model-LLM
    concurrency:
      group: daisuki-api-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Check deployment credentials
        run: |
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!key}" ]; then
              echo "::error::Set $key in GitHub environment model-LLM (token as secret, account ID as variable)."
              exit 1
            fi
          done
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Deploy API Worker
        working-directory: apps/api
        run: bunx wrangler@4.95.0 deploy --config wrangler.jsonc
      - name: Smoke test API health
        run: curl -fsS --retry 3 --retry-delay 3 --retry-all-errors https://api.daisuki.my.id/v1/health

  graph:
    name: Deploy Graph Worker
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: model-LLM
    concurrency:
      group: daisuki-graph-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Check deployment credentials
        run: |
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!key}" ]; then
              echo "::error::Set $key in GitHub environment model-LLM (token as secret, account ID as variable)."
              exit 1
            fi
          done
      - name: Deploy Graph Worker and assets
        working-directory: apps/graph
        run: bunx wrangler@4.95.0 deploy --config wrangler.jsonc
      - name: Smoke test Graph health
        run: curl -fsS --retry 3 --retry-delay 3 --retry-all-errors https://graph.daisuki.my.id/health

  web:
    name: Deploy Web Worker
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: model-LLM
    concurrency:
      group: daisuki-web-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Check deployment credentials
        run: |
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!key}" ]; then
              echo "::error::Set $key in GitHub environment model-LLM (token as secret, account ID as variable)."
              exit 1
            fi
          done
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build web
        working-directory: apps/web
        run: bun run build
      - name: Deploy Web Worker
        working-directory: apps/web
        run: bunx wrangler@4.95.0 deploy
      - name: Smoke test Web
        run: curl -fsSI --retry 3 --retry-delay 3 --retry-all-errors https://daisuki.my.id/
