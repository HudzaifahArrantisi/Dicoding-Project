<!doctype html>
<html lang="id">

      body {

        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #f6f7f9;

        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 26rem;

      }
      h1 {
        font-size: 1.7rem;
      }
      p {
        color: #5b6272;
        line-height: 1.6;
      }

        padding: 0 1.25rem;

        text-decoration: none;

        outline-offset: 4px;
